workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

# Auto-cancel pipelines superseded by a newer commit on the same branch.
default:
  interruptible: true

stages:
  - validate
  - drift-detection

validate:spec-index:
  stage: validate
  image: python:3.15.1-alpine@sha256:54448f67d7c31c39e5cdd3ea2d6382395ce142806c284425f8e897d78a0465b3
  before_script:
    - apk add --no-cache git
    - pip install -q 'pyyaml==6.0.3'
  script:
    - python3 .claude/skills/spec/scripts/generate_index.py
    - git diff --exit-code docs/specs/INDEX.md

validate:adr-index:
  stage: validate
  image: python:3.15.1-alpine@sha256:54448f67d7c31c39e5cdd3ea2d6382395ce142806c284425f8e897d78a0465b3
  before_script:
    - apk add --no-cache git
    - pip install -q 'pyyaml==6.0.3'
  script:
    - python3 .claude/skills/adr/scripts/generate_index.py
    - git diff --exit-code docs/decisions/INDEX.md

anchor-watch:
  stage: drift-detection
  # Tag AND digest, deliberately. A digest-only pin points at a manifest that goes
  # untagged the moment a newer release moves :latest, and GitLab.com garbage-collects
  # untagged manifests ~24h later -- which is exactly how this job broke before. The
  # tag keeps the manifest alive; the digest is the integrity check.
  image: registry.gitlab.com/boomshadow-public/anchor-watch-image:4.0.2@sha256:eb0395c92edeac76190d87173089296b7d1dd8a4917a9d6befb34590f0268c51
  script:
    - node .claude/agents/scripts/ci-drift-detector.mjs
  allow_failure: false
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
